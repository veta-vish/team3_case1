# OpenAPI 3.0.3 — платёжный сервис, кейс 1
#
# Как заполнять:
#   1. Не меняй строки с пометкой "ОБРАЗЕЦ" — это образец.
#   2. Строки с "TODO" замени на реальное описание.
#   3. Все 4 метода должны быть описаны: create, confirm, get, cancel.
#   4. У каждого метода — responses с кодами (201/200/402/404/409/422/504).
#   5. В примерах используй реальные данные из payments.csv.
#
# Проверь после заполнения: файл должен открываться в
#  без ошибок.
openapi: 3.0.3

info:
  title: Med-Service Payment Service
  version: "1.0.0"
  description: Встраиваемый платёжный сервис для клиники. Шлюз эмулируется.

servers:
  - url: http://localhost:8081

# ---------- ОБРАЗЕЦ: этот блок не трогать ----------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 64}
      description: UUID или стабильный ключ; хранится 24 ч

  schemas:
    PaymentCreate:
      type: object
      required: [order_id, recipient, purpose, amount, currency]
      properties:
        order_id: {type: string, minLength: 1, maxLength: 64,
                   pattern: '^[A-Za-z0-9_\-]+$'}
        recipient: {type: string, minLength: 1, maxLength: 64}
        purpose: {type: string, minLength: 1, maxLength: 200}
        amount: {type: number, format: double, exclusiveMinimum:0,   maximum: 1000000, multipleOf: 0.01}
        
        currency: {type: string, enum: [RUB]}

# ---------- TODO: опиши эти схемы сам ----------
    PaymentCreated:
      type: object
      required: [payment_id, status, confirm_token, expires_in]
      properties:
        payment_id: {type: string, example: "pay_0001"}
        status: {type: string,  example: "CREATED"}
        confirm_token: {type: string, example: "token_abc123"}
        expires_in: {type: integer, example: 600}
        

    PaymentStatus:
      type: object
      required: [payment_id, status, amount, currency]
      properties:
        payment_id: {type: string, example: "pay_0001"}
        status: {type: string, example: "SUCCESS"}
        error_code: {type: string, nullable: true, example: null}
        amount: {type: number, example: 2500.00}
        currency: {type: string, example: "RUB"}
        history:
          type: array
          items:
            type: object
            properties:
              status: {type: string}
              timestamp: {type: string, format: date-time, example:"2025-11-01T08:00:00Z"}


    PaymentConfirm:
      type: object
      required: [confirm_token]
      properties:
        confirm_token: {type: string, minLength: 8, maxLength: 64, example: "token_abc123"}
        method: {type: string, enum: [card_token, sms_code, biometric_stub], example: "sms_code"}

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code: {type: string, example: "VALIDATION_ERROR"}
        message: {type: string, example: "Поле purpose содержит недопустимые данные (PAN карты)."}
        retryable: {type: boolean, example: false}
        details:
          type: object
          properties:
              field: {type: string}
              code: {type: string}
      


# ---------- paths ----------
paths:
  # ---------- ОБРАЗЕЦ: health, не трогать ----------
  /health:
    get:
      summary: Проверка живости
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {status: {type: string, example: UP}}

  # ---------- TODO: создание платежа ----------
  /api/v1/payments:
    post:
      tags: [payments]
      summary: Создание нового платежа и получения токена на подтверждение
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              order_id: "ord_1001"
              recipient: "clinic_medservice"
              purpose: "Оплата медицинских услуг, прием терапевта"
              amount: 2500.00
              currency: "RUB"
      responses:
        '201':
          description: Платёж успешно создан, ожидает подтверждения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreated'
        '400':
          description: Некорректный запрос 
          content:
            application/json:
              schema:
                {$ref: '#/components/schemas/Error'}
        '404':
          description: Получатель не найден
          content:
            application/json:
              schema:
                {$ref: '#/components/schemas/Error'}
        '409':
          description: Дубликат заказа (Конфликт)
          content:
            application/json:
              schema:
                {$ref: '#/components/schemas/Error'}
              
        '422':
          description: Ошибка валидации бизнес-правил
          content:
            application/json:
              schema:
                {$ref: '#/components/schemas/Error'}
              example:
                error_code: "VALIDATION_ERROR"
                message: "Ошибка валидации данных платежа"
        '429':
          description: Слишком много запросов 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  # ---------- TODO: подтверждение ----------
  /api/v1/payments/{id}/confirm:
    post:
      tags: [payments]
      summary: Подтверждение проведения платежа с помощью токена
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: "pay_0001"}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentConfirm'}
            example:
              confirm_token: "token_abc123"
              method: "sms_code"
      responses:
        '200':
          description: Платёж успешно обработан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '402':
          description: Ошибка оплаты на стороне шлюза (нет средств / отклонено)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: Токен истёк или использован
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Неверный формат данных
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '504':
          description: Таймаут шлюза
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      

  # ---------- TODO: статус ----------
  /api/v1/payments/{id}:
    get:
      tags: [payments]
      summary: Получение текущего статуса платежа
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Информация о платеже
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentStatus'}
        '404':
          description: Платёж не найден
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  # ---------- TODO: отмена ----------
  /api/v1/payments/{id}/cancel:
    post:
      tags: [payments]
      summary: Отмена платежа (только до момента подтверждения)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Платёж успешно отменён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentStatus'}
        '409':
          description: Невозможно отменить платёж (уже подтверждён или обрабатывается)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}